services:
  blog-writefreely:
    image: algernon/writefreely:0.16.0-1
    container_name: writefreely
    restart: unless-stopped
    env_file: .env
    environment:
      WRITEFREELY_SINGLE_USER: "true"
      WRITEFREELY_OPEN_REGISTRATION: "false"
      WRITEFREELY_HOST: "https://blog.zahranm.cloud"
    volumes:
      - ./data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/nodeinfo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
