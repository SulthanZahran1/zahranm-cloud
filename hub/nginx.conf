server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header Vary "Accept, User-Agent" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;

  error_page 404 =404 /404.md;

  location = / {
    if ($http_user_agent ~* "(ClaudeBot|GPTBot|CCBot|Google-Extended|PerplexityBot|ChatGPT-User)") { rewrite ^ /index.md last; }
    if ($http_accept ~* "text/markdown") { rewrite ^ /index.md last; }
    try_files /index.html =404;
  }

  location = /about {
    if ($http_user_agent ~* "(ClaudeBot|GPTBot|CCBot|Google-Extended|PerplexityBot|ChatGPT-User)") { rewrite ^ /about/index.md last; }
    if ($http_accept ~* "text/markdown") { rewrite ^ /about/index.md last; }
    try_files /about/index.html =404;
  }

  location = /contact {
    if ($http_user_agent ~* "(ClaudeBot|GPTBot|CCBot|Google-Extended|PerplexityBot|ChatGPT-User)") { rewrite ^ /contact/index.md last; }
    if ($http_accept ~* "text/markdown") { rewrite ^ /contact/index.md last; }
    try_files /contact/index.html =404;
  }

  location = /privacy {
    if ($http_user_agent ~* "(ClaudeBot|GPTBot|CCBot|Google-Extended|PerplexityBot|ChatGPT-User)") { rewrite ^ /privacy/index.md last; }
    if ($http_accept ~* "text/markdown") { rewrite ^ /privacy/index.md last; }
    try_files /privacy/index.html =404;
  }

  location = /index.md {
    default_type text/markdown;
    add_header Vary "Accept, User-Agent" always;
    add_header Link '<https://zahranm.cloud/>; rel="canonical"' always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  location ~ ^/(about|contact|privacy)/index\.md$ {
    default_type text/markdown;
    add_header Vary "Accept, User-Agent" always;
    add_header Link '<https://zahranm.cloud/$1>; rel="canonical"' always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  location = /.well-known/agent-skills/index.json {
    default_type application/json;
  }

  location = /agent-instructions.md {
    default_type text/markdown;
  }

  location = /sitemap.md {
    default_type text/markdown;
  }

  location = /sitemap.xml {
    default_type application/xml;
  }

  location = /robots.txt {
    default_type text/plain;
  }

  location = /404.md {
    internal;
    default_type text/markdown;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
